spec_version: "0.1.0"
name: database-deadlock-analyzer
version: 1.0.0
description: Monitors relational database lock graphs and transaction logs to detect circular lock waits and recommend index restructuring.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - lock-graph-analysis
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - data-analytics
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/database-deadlock-analyzer"
